<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter 7 Puzzle Concept</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <section id="leftPanel" class="left-panel">
      <div id="dragOverlay" class="drag-overlay" draggable="false" role="button" aria-label="Draggable overlay"></div>
    </section>

    <section class="right-panel">
      <main class="container">
        <h1>Phone Lock</h1>
        <p>Enter passcode</p>

        <div id="display" class="display">----</div>

        <div id="keypad" class="keypad" aria-label="Numeric keypad">
          <button class="num-btn" data-num="1"><img src="images/1.png" alt="1"></button>
          <button class="num-btn" data-num="2"><img src="images/2.png" alt="2"></button>
          <button class="num-btn" data-num="3"><img src="images/3.png" alt="3"></button>
          <button class="num-btn" data-num="4"><img src="images/4.png" alt="4"></button>
          <button class="num-btn" data-num="5"><img src="images/5.png" alt="5"></button>
          <button class="num-btn" data-num="6"><img src="images/6.png" alt="6"></button>
          <button class="num-btn" data-num="7"><img src="images/7.png" alt="7"></button>
          <button class="num-btn" data-num="8"><img src="images/8.png" alt="8"></button>
          <button class="num-btn" data-num="9"><img src="images/9.png" alt="9"></button>
          <button class="num-btn" data-num="0"><img src="images/0.png" alt="0"></button>
          <button class="action-btn" id="clearBtn"><img src="images/reset.png" alt="Clear"></button>
          
          <button class="action-btn" id="submitBtn"><img src="images/confirm.png" alt="Enter"></button>
        </div>

        <div id="message" class="message"></div>
      </main>
    </section>
  </div>

  <script src="puzzle.js"></script>
</body>
</html>
